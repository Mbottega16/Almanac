services:
  - type: web
    name: almanac-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/almanac.db
      # ADMIN_PASSWORD / ADMIN_SESSION_SECRET must be set here before this
      # service is actually deployed — the app has no auth gate otherwise.
